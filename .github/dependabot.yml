version: 2
updates:
  # npm dependencies. Group all minor + patch updates into one weekly PR so
  # the queue stays quiet; major bumps each get their own PR for human review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # GitHub Actions used in the workflows under .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
