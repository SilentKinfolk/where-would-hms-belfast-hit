name: Security autopatch

# The half of dependency security that Dependabot cannot do.
#
# Dependabot bumps what package.json declares. A vulnerable package that arrives
# through a dependency pinning it exactly has nothing to bump, so its alert stays
# open indefinitely: GHSA-f88m-g3jw-g9cj sat open from 2026-07-21 because
# staticmaps pins "sharp": "0.33.2" and its latest release still does. Dependabot
# would never have closed it.
#
# scripts/auto-patch-security.mjs finds those cases and forces the resolution
# with a direct dependency plus a self-referencing override, then verifies the
# result against the tests and a production build before anything is committed.
# A red build reverts the batch and leaves the advisory open for the next run.
#
# The commit lands on main directly, without review, on purpose. The owner asked
# for security patches that never need their input, and a PR that waits for a
# human is what produced the six-week Dependabot queue this repo started with.
# The gate is the verification the script runs, not a person.

on:
  schedule:
    # Daily, on an off-hour minute clear of the hourly fire-the-guns run at :37.
    - cron: '11 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch deploy.yml after a push

concurrency:
  group: security-autopatch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Force resolutions Dependabot cannot reach
        id: patch
        run: node scripts/auto-patch-security.mjs

      # The script has already run the tests and the build against these
      # resolutions and reverted anything that failed, so reaching here with
      # patched=true means the tree is green.
      - name: Commit the patched manifest
        if: steps.patch.outputs.patched == 'true'
        env:
          SUMMARY: ${{ steps.patch.outputs.summary }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain package.json package-lock.json)" ]; then
            echo "Script reported a patch but the manifest is unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Force security resolution: ${SUMMARY}" \
                     -m "Applied by .github/workflows/security-autopatch.yml. Tests and production build passed against these resolutions before the commit was made."

          # fire-the-guns.yml pushes impacts.json to main every hour, so a
          # collision here is routine rather than exceptional. Rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto main."
            git pull --rebase --autostash
          done
          echo "Could not push after 3 attempts."
          exit 1

      # A push made with GITHUB_TOKEN raises no push event, so deploy.yml
      # (on: push) never fires and Pages would keep serving the old bundle.
      - name: Redeploy Pages
        if: steps.patch.outputs.patched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
