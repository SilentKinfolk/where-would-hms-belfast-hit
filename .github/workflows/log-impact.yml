name: Fire the guns

# Every 30 minutes: re-run the engine server-side with live weather and append
# one entry to public/impacts.json. The site fetches that file as the shared
# ghost trail, so all visitors see the same history regardless of browser.

on:
  schedule:
    # Off-hour minutes (7 and 37) to dodge the on-the-hour stampede that gets
    # GH Actions scheduled runs deprioritised and routinely delayed/skipped.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-impact
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ANTHROPIC_API_KEY is a repo secret (Settings → Secrets and variables →
      # Actions). It's only exposed to this step. GH Actions masks the value
      # in logs (shown as ***), and forked-PR workflows don't get secrets.
      # DESCRIBE_MODEL picks Haiku 4.5 for cost (~$0.004/call, ~$6/month);
      # flip to claude-opus-4-8 if Haiku's map reading isn't crisp enough.
      - run: npm run log-impact
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESCRIBE_MODEL: claude-haiku-4-5

      # The browser fetches public/impacts.json straight from raw.githubusercontent.com
      # — no Pages redeploy required, just commit + push. (deploy.yml ignores
      # this path so cron commits don't trigger a no-op rebuild.)
      - name: Commit impact if changed
        run: |
          if [ -z "$(git status --porcelain public/impacts.json)" ]; then
            echo "impacts.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/impacts.json
          git commit -m "log impact $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
