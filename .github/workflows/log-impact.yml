name: Log impact

# Every 30 minutes: re-run the engine server-side with live weather and append
# one entry to public/impacts.json. The site fetches that file as the shared
# ghost trail, so all visitors see the same history regardless of browser.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to trigger the Deploy workflow ourselves

concurrency:
  group: log-impact
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run log-impact

      - name: Commit impact if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/impacts.json)" ]; then
            echo "impacts.json unchanged — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/impacts.json
          git commit -m "log impact $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows (GitHub's
      # anti-loop rule), so kick off Deploy ourselves when we actually committed.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
