name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The shared ghost trail (public/impacts.json) and the cron-regenerated OG
    # image (public/og.png) are fetched by the browser / social platforms
    # directly from raw.githubusercontent.com, so cron commits to them don't
    # need a Pages redeploy.
    paths-ignore:
      - 'public/impacts.json'
      - 'public/og.png'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
