name: CI

on:
  push:
    branches: [main]
    # log-impact cron churns public/impacts.json every 30 min; nothing in there
    # changes code or tests, so skip CI for those commits (deploy still runs).
    paths-ignore:
      - 'public/impacts.json'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
